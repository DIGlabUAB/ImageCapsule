[metadata]
name = imgcapsule
version = 0.1.0
description = Portable semantic sidecars for images.
long_description = file: README.md
long_description_content_type = text/markdown
license = MIT
author = imgcapsule contributors

[options]
package_dir =
    = src
packages = find:
python_requires = >=3.9
include_package_data = true

[options.packages.find]
where = src

[options.entry_points]
console_scripts =
    imgcapsule = imgcapsule.cli:main

[options.extras_require]
vision =
    Pillow>=10
dev =
    pytest>=7
