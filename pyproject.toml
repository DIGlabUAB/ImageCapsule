[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "imgcapsule"
version = "0.1.0"
description = "Portable semantic sidecars for images: hashes, metadata, previews, provenance, and searchable capsules."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [
  { name = "imgcapsule contributors" }
]
keywords = ["images", "metadata", "semantic-search", "ocr", "embeddings", "sqlite"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Multimedia :: Graphics",
  "Topic :: Software Development :: Libraries :: Python Modules"
]
dependencies = []

[project.optional-dependencies]
vision = ["Pillow>=10"]
ocr = ["Pillow>=10", "pytesseract>=0.3"]
dev = ["pytest>=7"]

[project.scripts]
imgcapsule = "imgcapsule.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
